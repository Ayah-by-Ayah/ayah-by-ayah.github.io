<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Read the Qur'an ayah by ayah: Arabic in IndoPak and Madani script, a revised English translation, notes, lessons, word analysis and full grammar and iʿrāb, in English, Bangla, Arabic and Urdu.">
<meta property="og:title" content="Ayah by Ayah">
<meta property="og:description" content="Qur'an study, one ayah at a time: translation, notes, lessons, word analysis and grammar.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#1E4E79">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231E4E79'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='white' font-family='serif'%3E%D8%A2%3C/text%3E%3C/svg%3E">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Ayah by Ayah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Scheherazade+New:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Noto+Naskh+Arabic:wght@400;600&family=Noto+Nastaliq+Urdu:wght@400;600&family=Noto+Serif+Bengali:wght@400;600&display=swap">
<style>
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --sunk:#E9ECE8; --ink:#1B2427; --muted:#5B6669; --line:#D6DCD7;
  --accent:#1E4E79; --accent-ink:#FFFFFF; --focus:#1E4E79;
  --rev:#9A5A12; --rev-bg:#F7EBDB; --exp:#1E4E79; --exp-bg:#E1EAF3; --qa:#23685C; --qa-bg:#DCEEEA; --les:#723867; --les-bg:#F1E2EE;
  --danger:#A3322A; --flash:#FFF3C4;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-text:"Literata",Georgia,"Times New Roman",serif;
  --f-quran:"Scheherazade New","Noto Naskh Arabic","Traditional Arabic",serif;
  --q-scale:1;
  --f-ar:"Noto Naskh Arabic","Amiri Quran","Traditional Arabic",serif;
  --f-ur:"Noto Nastaliq Urdu","Noto Naskh Arabic","Jameel Noori Nastaleeq",serif;
  --f-bn:"Noto Serif Bengali","Kalpurush","SolaimanLipi",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#111719; --surface:#182023; --sunk:#131a1c; --ink:#E4E9E7; --muted:#98A4A6; --line:#2B3538;
  --accent:#86B5DE; --accent-ink:#0E1B26; --focus:#86B5DE;
  --rev:#E3A75E; --rev-bg:#3A2A17; --exp:#86B5DE; --exp-bg:#1B2C3B; --qa:#73C3B3; --qa-bg:#16312C; --les:#D69BC8; --les-bg:#35202F;
  --danger:#F08A80; --flash:#3B3514;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111719; --surface:#182023; --sunk:#131a1c; --ink:#E4E9E7; --muted:#98A4A6; --line:#2B3538;
  --accent:#86B5DE; --accent-ink:#0E1B26; --focus:#86B5DE;
  --rev:#E3A75E; --rev-bg:#3A2A17; --exp:#86B5DE; --exp-bg:#1B2C3B; --qa:#73C3B3; --qa-bg:#16312C; --les:#D69BC8; --les-bg:#35202F;
  --danger:#F08A80; --flash:#3B3514;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-ui);}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:var(--accent)}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto;cursor:pointer;background:none;border:0;padding:0}
.brand b{font:600 19px/1 var(--f-text);letter-spacing:-.01em}
.brand span{font:20px/1 var(--f-quran);color:var(--muted)}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs button{border:0;background:none;padding:6px 10px;border-radius:6px;color:var(--muted);font-weight:500;cursor:pointer}
nav.tabs button[aria-current="page"]{background:var(--sunk);color:var(--ink)}
nav.tabs button:hover{color:var(--ink)}
.langbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.langbar .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 10px;cursor:pointer;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg .l-bn{font-family:var(--f-bn)} .seg .l-ar{font-family:var(--f-ar)} .seg .l-ur{font-family:var(--f-ur);font-size:13px}
.modepill{font-size:12px;padding:3px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.modepill.admin{background:var(--rev-bg);color:var(--rev)}

main{padding-block:22px 80px}
h1,h2,h3{font-family:var(--f-text);text-wrap:balance;margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:500;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.ghost{border-color:transparent;background:none;color:var(--accent);padding-inline:6px}
.btn:disabled{opacity:.5;cursor:default}
.field{display:flex;flex-direction:column;gap:4px}
.field label,.flabel{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
input[type=text],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%}
textarea{resize:vertical;min-height:90px;line-height:1.6}
.search{max-width:520px;flex:1 1 260px}

/* Marks */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;border:0;cursor:default;white-space:nowrap}
button.chip{cursor:pointer}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.rev{background:var(--rev-bg);color:var(--rev)}
.chip.exp{background:var(--exp-bg);color:var(--exp)}
.chip.qa{background:var(--qa-bg);color:var(--qa)}
.chip.les{background:var(--les-bg);color:var(--les)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:5px;background:var(--sunk);color:var(--muted);border:1px solid transparent;cursor:pointer}
.tag[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.legend{display:flex;gap:8px;flex-wrap:wrap}

/* Surah index */
.idx-head{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-bottom:16px}
.idx-head h1{font-size:26px;margin-right:auto}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.scard{display:grid;grid-template-columns:34px 1fr auto;gap:2px 10px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;cursor:pointer}
.scard:hover{border-color:var(--accent)}
.scard .no{grid-row:span 2;font:600 13px/1 var(--f-ui);color:var(--muted);font-variant-numeric:tabular-nums;text-align:center}
.scard .tl{font-weight:600}
.scard .arn{grid-row:span 2;font:22px/1.2 var(--f-quran)}
.scard .meta{font-size:12px;color:var(--muted)}
.scard .marks{grid-column:2/4;display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.scard .marks:empty{display:none}

/* Surah reader */
.shead{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;margin-bottom:10px}
.shead .mid{text-align:center}
.shead .arn{font:34px/1.4 var(--f-quran)}
.shead h1{font-size:22px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:10px 0 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
.toolbar input[type=text]{width:90px}
.qfont{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.qfont select{width:auto;padding:5px 8px}
.qfont .seg button{min-width:34px;font-weight:600}
.bism{text-align:center;font:calc(28px * var(--q-scale))/2 var(--f-quran);padding:12px 0 4px}
html.script-indopak{--f-quran:"IndoPak Quran","Scheherazade New","Noto Naskh Arabic",serif}
html.script-indopak .ar,html.script-indopak .ref-ar,html.script-indopak .bism{line-height:2.45;word-spacing:.08em}
html.script-indopak .ar{font-size:calc(30px * var(--q-scale))}
html.script-indopak .ar .end{font-family:"Scheherazade New",serif}
.ayah{display:grid;grid-template-columns:52px 1fr;gap:0 14px;padding:18px 0;border-bottom:1px solid var(--line);scroll-margin-top:120px}
.ayah.flash{animation:flash 2.2s ease-out}
@keyframes flash{from{background:var(--flash)}to{background:transparent}}
@media (prefers-reduced-motion:reduce){.ayah.flash{animation:none;background:var(--flash)}}
.anum{font:600 13px/1 var(--f-ui);color:var(--muted);font-variant-numeric:tabular-nums;padding-top:12px}
.anum .dots{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.anum .dot{width:8px;height:8px;border-radius:50%}
.dot.rev{background:var(--rev)} .dot.exp{background:var(--exp)} .dot.qa{background:var(--qa)} .dot.les{background:var(--les)}
.abody{min-width:0}
.ar{font:calc(29px * var(--q-scale))/2.2 var(--f-quran);direction:rtl;text-align:right;margin:0 0 10px}
.ar .end{font-size:.8em;color:var(--muted);white-space:nowrap}
.tr{font:16.5px/1.65 var(--f-text);margin:0;max-width:68ch}
.tr.revised{border-left:3px solid var(--rev);padding-left:12px}
.tr[lang="bn"],.orig[lang="bn"]{font-family:var(--f-bn)}
.tr[lang="ur"],.orig[lang="ur"]{font-family:var(--f-ur);line-height:2.3;font-size:17px}
.tr[dir="rtl"]{margin-left:auto}
.tr[dir="rtl"].revised{border-left:0;border-right:3px solid var(--rev);padding-left:0;padding-right:12px}
.revline{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px}
.orig{margin:8px 0 0;padding:8px 12px;background:var(--sunk);border-radius:7px;font:14.5px/1.6 var(--f-text);color:var(--muted);max-width:68ch}
.orig b{font:600 11px/1 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:4px}
.marks{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.admin-bar{display:flex;gap:2px;flex-wrap:wrap;margin-top:8px}
.admin-bar .btn{font-size:13px}

/* Write-ups */
.wlist{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.wcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.wcard .whead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.wcard h3{font-size:17px;flex-basis:100%}
.wcard .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px}
.notice{font-size:12px;color:var(--muted);background:var(--sunk);padding:4px 8px;border-radius:5px;display:inline-block;margin:4px 0}
.prose{font:15.5px/1.7 var(--f-text);max-width:70ch}
.prose p{margin:0 0 .8em} .prose p:last-child{margin-bottom:0}
.prose h4{font:600 15px/1.4 var(--f-ui);margin:1em 0 .4em}
.prose ul,.prose ol{margin:0 0 .8em;padding-inline-start:1.3em}
.prose blockquote{margin:0 0 .8em;padding:4px 12px;border-inline-start:3px solid var(--line);color:var(--muted)}
[lang="bn"] {font-family:var(--f-bn)}
[lang="ar"].w{font-family:var(--f-ar);font-size:1.12em;line-height:1.9}
[lang="ur"].w{font-family:var(--f-ur);line-height:2.3}
h3[lang="ur"],h3[lang="ar"]{font-family:inherit}
.wcard h3[lang="ar"]{font-family:var(--f-ar)} .wcard h3[lang="ur"]{font-family:var(--f-ur);line-height:2} .wcard h3[lang="bn"]{font-family:var(--f-bn)}
.reflink{font-weight:600;font-variant-numeric:tabular-nums;background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}

/* Index pages */
.phead{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-bottom:6px}
.phead h1{font-size:26px;margin-right:auto}
.lede{max-width:70ch;color:var(--muted);margin:4px 0 16px}
.filters{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.tagrow{display:flex;gap:5px;flex-wrap:wrap}
.results{display:flex;flex-direction:column;gap:10px}
.snip{color:var(--muted);font-size:14px;margin-top:4px;max-width:70ch}
.empty{padding:26px 18px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);text-align:center}
.empty b{color:var(--ink);display:block;margin-bottom:4px}
.lesson-ayahs{margin-top:12px;border-top:1px solid var(--line)}
.lesson-ayahs .la{padding:10px 0;border-bottom:1px solid var(--line)}
.lesson-ayahs .ar{font-size:calc(25px * var(--q-scale));margin-bottom:4px}
.lesson-ayahs .tr{font-size:15px}

/* Modal */
.backdrop{position:fixed;inset:0;background:rgba(10,16,18,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:max(24px,env(safe-area-inset-top,0px)) 12px 24px}
.dialog{background:var(--surface);border-radius:12px;width:100%;max-width:760px;padding:18px 18px 16px;box-shadow:0 20px 50px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:14px}
.dialog h2{font-size:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.ltabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.ltabs button{border:0;background:none;padding:7px 12px;border-bottom:2px solid transparent;cursor:pointer;color:var(--muted);font-weight:500;margin-bottom:-1px}
.ltabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.ltabs .flag{font-size:10px;font-weight:600;color:var(--rev);margin-left:4px;letter-spacing:.03em}
.ltabs .filled::after{content:" ●";color:var(--qa);font-size:9px}
.aibox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--sunk);border-radius:8px;padding:8px 10px}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--rev-bg);color:var(--ink);padding:8px 10px;border-radius:8px}
.err{color:var(--danger);font-size:13px}
.foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.ref-ar{font:22px/2 var(--f-quran);direction:rtl;text-align:right;margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:60;font-size:14px;max-width:calc(100% - 32px)}
.statusbar{font-size:12.5px;color:var(--muted);padding:8px 12px;background:var(--sunk);border-radius:8px;margin-bottom:14px}

/* Articles */
.dialog.wide{max-width:1080px}
.fmtbar{display:flex;flex-wrap:wrap;gap:4px;padding:6px;border:1px solid var(--line);border-bottom:0;border-radius:7px 7px 0 0;background:var(--sunk)}
.fmtbar button{border:1px solid transparent;background:none;padding:3px 8px;border-radius:5px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.fmtbar button:hover{background:var(--surface);border-color:var(--line)}
.editor-area{border-radius:0 0 7px 7px;min-height:420px;font-size:15px}
.editor-area[lang="ur"]{font-family:var(--f-ur);line-height:2.3}
.editor-area[lang="ar"]{font-family:var(--f-ar);font-size:17px;line-height:1.9}
.editor-area[lang="bn"]{font-family:var(--f-bn)}
.fmthelp{margin-top:6px} .fmthelp summary{cursor:pointer} .fmthelp div{margin-top:6px;line-height:1.7}
.fmthelp code{background:var(--sunk);padding:1px 5px;border-radius:4px;font-size:12px;color:var(--ink)}
.preview{border:1px solid var(--line);border-radius:7px;padding:18px;max-height:65vh;overflow:auto;background:var(--bg)}
.article{max-width:1000px}
.art-head{display:flex;flex-direction:column;gap:10px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.art-title{font:600 clamp(26px,4vw,36px)/1.2 var(--f-text);letter-spacing:-.01em;max-width:30ch}
.art-title[lang="ar"]{font-family:var(--f-ar);line-height:1.6} .art-title[lang="ur"]{font-family:var(--f-ur);line-height:2} .art-title[lang="bn"]{font-family:var(--f-bn);line-height:1.5}
.art-sum{font:italic 18px/1.6 var(--f-text);color:var(--muted);margin:0;max-width:65ch}
.art-sum[lang="ar"],.art-sum[lang="ur"],.art-sum[lang="bn"]{font-style:normal}
.art-sum[lang="ur"]{font-family:var(--f-ur);line-height:2.2} .art-sum[lang="ar"]{font-family:var(--f-ar)} .art-sum[lang="bn"]{font-family:var(--f-bn)}
.art-ayahs{padding:6px 0 10px;border-bottom:1px solid var(--line);margin-bottom:26px}
.art-ayahs .la{padding:12px 0;border-bottom:1px dashed var(--line)} .art-ayahs .la:last-of-type{border-bottom:0}
.art-ayahs .ar{font-size:calc(27px * var(--q-scale));margin-bottom:6px}
.art-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:26px}
@media (min-width:900px){.art-grid:has(.toc){grid-template-columns:220px minmax(0,1fr)} .art-grid .toc{position:sticky;top:90px;align-self:start;max-height:calc(100vh - 110px);overflow:auto}}
.toc{border-inline-start:2px solid var(--line);padding-inline-start:12px;font-size:13.5px}
.toc ol{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.toc li.t3{padding-inline-start:12px;font-size:13px}
.toc button{background:none;border:0;padding:0;text-align:start;color:var(--muted);cursor:pointer;line-height:1.4}
.toc button:hover{color:var(--accent)}
.toc[lang="ur"]{font-family:var(--f-ur);line-height:2} .toc[lang="ar"]{font-family:var(--f-ar)} .toc[lang="bn"]{font-family:var(--f-bn)}
.article-body{font-size:17px;line-height:1.8;max-width:68ch}
.article-body[lang="ar"]{font-size:19px;line-height:2} .article-body[lang="ur"]{font-size:18px;line-height:2.4}
.prose h3.ah2{font:600 23px/1.3 var(--f-text);margin:1.6em 0 .5em;scroll-margin-top:100px}
.prose h4.ah3{font:600 18px/1.4 var(--f-text);margin:1.3em 0 .4em;scroll-margin-top:100px}
.prose h5.ah4{font:600 14px/1.4 var(--f-ui);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:1.2em 0 .4em}
.prose[lang="ar"] :is(h3,h4,h5),.prose[lang="ur"] :is(h3,h4,h5),.prose[lang="bn"] :is(h3,h4,h5){font-family:inherit;text-transform:none;letter-spacing:0}
.prose > :first-child{margin-top:0}
.prose hr{border:0;border-top:1px solid var(--line);margin:1.8em auto;width:40%}
.prose .ar-quote{font:calc(25px * var(--q-scale))/2.2 var(--f-quran);text-align:center;background:var(--sunk);border-radius:8px;padding:12px 16px;margin:1em 0}
.prose a{text-underline-offset:2px}
.fnref button{background:none;border:0;padding:0 1px;color:var(--accent);cursor:pointer;font:600 .72em/1 var(--f-ui);vertical-align:super}
.footnotes{margin-top:2.2em;padding-top:12px;border-top:1px solid var(--line);font-size:14px;line-height:1.6;color:var(--muted)}
.footnotes h4{font:600 12px/1 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;margin:0 0 8px}
.footnotes ol{padding-inline-start:1.4em;margin:0}
.footnotes li{margin-bottom:6px;scroll-margin-top:100px}
.fnback{background:none;border:0;color:var(--accent);cursor:pointer;padding:0 4px}
.hl{background:var(--flash);transition:background .3s}

/* Grammar */
.gbtn{font-weight:600}
.gdot{color:var(--qa);font-weight:600}
.gh{font:600 16px/1.3 var(--f-ui);margin:4px 0 10px}
.gar{font-family:var(--f-ar)}
.g-n{color:var(--exp)} .g-v{color:var(--qa)} .g-p{color:var(--rev)}
.gstrip{display:flex;flex-wrap:wrap;gap:6px;padding:10px;background:var(--sunk);border-radius:8px}
.gchip{font:25px/1.7 var(--f-quran);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:0 10px;cursor:pointer}
.gchip[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.usage{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.usage .uhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.usage .ustats{font-size:13.5px;color:var(--muted)}
.usage .uforms{display:flex;flex-wrap:wrap;gap:6px}
.usage .uform{font:17px/1.6 var(--f-ar);background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:0 8px;cursor:pointer}
.usage .uform[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.usage .uform small{font:12px var(--f-ui);color:var(--muted);margin-inline-start:4px}
.usage .ulist{max-height:420px;overflow:auto;border-top:1px solid var(--line)}
.usage .urow{padding:8px 2px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:64px 1fr;gap:4px 10px}
.usage .urow.cur{background:var(--sunk)}
.usage .uref{font:600 12.5px/1.8 var(--f-ui);color:var(--muted)}
.usage .uref em{display:block;font-style:normal;font-weight:400;font-size:11px}
.usage .uar{font:21px/1.9 var(--f-quran);margin:0;grid-column:2}
.usage .uar mark{background:color-mix(in srgb, var(--accent) 22%, transparent);color:inherit;border-radius:4px;padding:0 2px}
.usage .utr{margin:0;grid-column:2;font-size:14px;max-width:none}
.usage .uask{display:flex;flex-direction:column;gap:6px;background:var(--sunk);border-radius:8px;padding:8px 10px}
.usage .uask textarea{min-height:58px}
.usage .uans{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;max-height:420px;overflow:auto}
.usage .ugloss{grid-column:2;font-size:12.5px;color:var(--muted)}
@media (max-width:560px){.usage .urow{grid-template-columns:1fr}.usage .uar,.usage .utr,.usage .ugloss{grid-column:1}}
.glegend{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0 12px}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;direction:rtl}
.gword{direction:ltr;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--surface);scroll-margin:80px}
.gword.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.gw-top{display:flex;align-items:center;gap:10px;justify-content:space-between}
.gw-n{font:600 12px/1 var(--f-ui);color:var(--muted);background:var(--sunk);border-radius:99px;padding:3px 7px}
.gw-ar{font:30px/1.8 var(--f-quran)}
.gw-mean{font-size:13.5px;color:var(--muted);margin-bottom:6px}
.gw-segs{display:flex;flex-direction:column;gap:6px;border-top:1px dashed var(--line);padding-top:6px}
.gseg-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;font-size:13.5px}
.gseg-t{font:21px/1.4 var(--f-quran)}
.gseg-d{font-size:12.5px;color:var(--muted);line-height:1.5}
.gtag{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.irab{font-size:16px}
.irab[lang="ar"]{font-size:18px;line-height:2.1}

/* Sentence structure */
.syn-sent{border:1px solid var(--line);border-radius:9px;padding:6px 10px;margin-bottom:10px;background:var(--surface)}
.syn-span{padding:6px 2px 8px;border-bottom:1px dashed var(--line);margin-bottom:4px;color:var(--muted)}
.syn-rows{display:flex;flex-direction:column}
.syn-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.2fr) minmax(0,1fr);gap:4px 12px;align-items:baseline;padding:6px 2px;border-bottom:1px solid var(--line);direction:rtl}
.syn-row:last-child{border-bottom:0}
.syn-row.away{opacity:.62}
.syn-w{font:23px/1.7 var(--f-quran)}
.syn-row.is-cons{background:var(--sunk);border-radius:6px;padding-inline:8px}
.syn-cons{font-size:.9em}
.syn-clab{font:600 12.5px/1 var(--f-ar);color:var(--les);background:var(--les-bg);padding:3px 6px;border-radius:5px;vertical-align:middle}
.syn-elided{font:600 15px/1 var(--f-ar);color:var(--muted);border:1px dashed var(--line);border-radius:5px;padding:2px 6px}
.syn-r{display:flex;flex-direction:column;gap:1px}
.syn-r b{font:600 16px/1.5 var(--f-ar);color:var(--accent)}
.syn-r span{font-size:12px;color:var(--muted);direction:ltr;text-align:right}
.syn-h{font:18px/1.6 var(--f-quran);color:var(--muted)}
.syn-ref{font:600 11.5px/1 var(--f-ui);margin-inline-start:4px}
.gseg-rel{font:14px/1.6 var(--f-ar);color:var(--accent);margin-top:2px}
@media (max-width:640px){.syn-row{grid-template-columns:1fr 1fr}.syn-h{grid-column:1/-1}}

/* Categories */
.chip.cat{background:var(--sunk);color:var(--ink);border:1px solid var(--line)}
.chip.cat::before{background:var(--rev)}
.catfilter{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.catfilter .flabel{margin-right:4px}
.catpill{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13.5px;font-weight:500;cursor:pointer}
.catpill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.catpill[aria-pressed="true"] .muted{color:inherit;opacity:.7}
.catlist{display:flex;flex-direction:column;gap:8px}
.catrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.catord{display:flex;flex-direction:column}
.catnames{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.catnames input[lang="ur"]{font-family:var(--f-ur)} .catnames input[lang="ar"]{font-family:var(--f-ar)} .catnames input[lang="bn"]{font-family:var(--f-bn)}
.catmeta{white-space:nowrap;text-align:right}
@media (max-width:700px){.catnames{grid-template-columns:1fr 1fr}.catrow{grid-template-columns:auto 1fr}.catmeta{grid-column:1/-1;text-align:left}}

/* Full screen reading */
:root{--read-scale:1}
.focusbar{position:fixed;z-index:40;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:6px 8px 6px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.14);max-width:calc(100% - 24px);opacity:.35;transition:opacity .2s}
.focusbar:hover,.focusbar:focus-within{opacity:1}
.backpill{position:fixed;z-index:41;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:2px;background:var(--accent);color:var(--accent-ink);border-radius:999px;box-shadow:0 6px 22px rgba(0,0,0,.22);max-width:calc(100% - 32px)}
.backpill button{border:0;background:none;color:inherit;font:600 14px/1.2 var(--f-ui);padding:10px 6px 10px 16px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70vw}
.backpill button.x{padding:10px 14px 10px 8px;font-weight:400;opacity:.8}
@media (hover:none){.focusbar{opacity:.92}}
.fb-title{font:600 14px/1.2 var(--f-text);max-width:34ch;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html.reading .top,html.reading .toolbar,html.reading .admin-bar,html.reading .art-actions,html.reading .statusbar,html.reading .shead > div:first-child,html.reading .shead > div:last-child{display:none}
html.reading body{background:var(--surface)}
html.reading main{padding-block:72px 96px;max-width:900px}
html.reading .ayah{border-bottom-color:var(--sunk);padding:26px 0}
html.reading .tr{font-size:calc(18px * var(--read-scale));max-width:none}
html.reading .prose,html.reading .article-body{font-size:calc(18.5px * var(--read-scale))}
html.reading .article{max-width:none}
html.reading .art-title{font-size:calc(40px * var(--read-scale))}
html.reading .shead{grid-template-columns:1fr}
@media (min-width:1100px){html.reading main:has(.toc){max-width:1180px}}
@media (max-width:640px){.fb-title{max-width:14ch}html.reading main{padding-block:64px 80px}}

/* Word analysis */
:root{--wa:#8A4B12;--wa-bg:#F6E7D6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--wa:#E9B27A;--wa-bg:#3A2616}}
:root[data-theme="dark"]{--wa:#E9B27A;--wa-bg:#3A2616}
.chip.wa{background:var(--wa-bg);color:var(--wa)}
.dot.wa{background:var(--wa)}
.wa-ar{font-family:var(--f-ar);font-size:14px}
.wa-head,.wa-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
.wa-word{font:44px/1.6 var(--f-quran);color:var(--ink)}
.wa-word.sm{font-size:32px}
.wa-meta{font-size:13.5px;color:var(--muted)}
.wa-meta b{font:600 17px/1 var(--f-ar);color:var(--ink)}
.gw-link{margin-bottom:4px}
footer.src{font-size:12px;color:var(--muted);padding-top:30px}
@media (max-width:640px){
  .ayah{grid-template-columns:36px 1fr;gap:0 10px}
  .ar{font-size:calc(25px * var(--q-scale))}
  .shead .arn{font-size:28px}
  .brand span{display:none}
}

<body>

<header class="top">
  <div class="wrap">
    <button class="brand" id="brand" type="button" aria-label="Ayah by Ayah, surah list"><b>Ayah by Ayah</b><span>آية بعد آية</span></button>
    <nav class="tabs" aria-label="Sections">
      <button type="button" data-nav="surahs">Surahs</button>
      <button type="button" data-nav="notes">Notes</button>
      <button type="button" data-nav="lessons">Lessons</button>
      <button type="button" data-nav="words">Word analysis</button>
    </nav>
    <div class="langbar">
      <span class="lbl">Write-ups in</span>
      <div class="seg" role="group" aria-label="Write-up language">
        <button type="button" data-lang="en">English</button>
        <button type="button" data-lang="bn" class="l-bn">বাংলা</button>
        <button type="button" data-lang="ar" class="l-ar">العربية</button>
        <button type="button" data-lang="ur" class="l-ur">اردو</button>
      </div>
      <span class="lbl">Translation</span>
      <div class="seg" role="group" aria-label="Ayah translation language">
        <button type="button" data-trlang="en" title="Saheeh International">English</button>
        <button type="button" data-trlang="bn" class="l-bn" title="Taisirul Quran">বাংলা</button>
        <button type="button" data-trlang="ur" class="l-ur" title="Maududi, Tafheem-ul-Quran">اردو</button>
      </div>
      <span class="modepill" id="modepill">Reader</span>
    </div>
  </div>
</header>
<main class="wrap" id="app"><p class="muted">Loading the Qur'an text…</p></main>
<div id="modal-root"></div>
<div id="focus-root"></div>
<div id="back-root"></div>
<div id="toast-root"></div>

<script>
(() => {
"use strict";
const LANGS = ["en","bn","ar","ur"];
const LNAME = {en:"English", bn:"বাংলা", ar:"العربية", ur:"اردو"};
const LNAME_EN = {en:"English", bn:"Bangla", ar:"Arabic", ur:"Urdu"};
const RTL = {ar:true, ur:true};
const TR_LANGS = ["en","bn","ur"];
const TR_NAME = {en:"Saheeh International", bn:"Taisirul Quran", ur:"Maududi (Tafheem-ul-Quran)"};
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const arDigits = n => String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch {} }
};

const S = {
  Q: null, view: "surahs", surah: 1, flashKey: null,
  lang: LANGS.includes(store.get("aba.lang")) ? store.get("aba.lang") : "en",
  script: store.get("aba.script") === "madani" ? "madani" : "indopak", IP: null, ipState: "idle",
  qfont: ["sch","naskh","amiri"].includes(store.get("aba.qfont")) ? store.get("aba.qfont") : "sch",
  qscale: Math.min(1.6, Math.max(0.8, parseFloat(store.get("aba.qscale")) || 1)),
  trLang: TR_LANGS.includes(store.get("aba.trlang")) ? store.get("aba.trlang") : "en",
  trAll: {en:{}, bn:{}, ur:{}}, TRX: {bn:null, ur:null}, trxState: {},
  tr: {}, notes: [], lessons: [], rawNotes: [], rawLessons: [], rawWords: [], chunkIx: {}, chunkDocs: [],
  admin: false, db: null, dbState: "loading", sample: null, downloads: null,
  open: new Set(), compare: new Set(), onlyMarked: false,
  words: [], wq: "", wroot: "", cats: [], ncat: "", focus: false, readScale: Math.min(1.5, Math.max(0.85, parseFloat(store.get("aba.readscale")) || 1)), sq: "", nq: "", nkind: "all", ntag: null, lq: "", ltag: null, openLesson: new Set(), openNote: new Set()
};

/* ---------- helpers ---------- */
const key = (s,a) => s + ":" + a;
const surahOf = n => S.Q && S.Q[n-1];
const validRef = (s,a) => !!(S.Q && s>=1 && s<=114 && a>=1 && a<=S.Q[s-1].v.length);
/* ---------- ayah translations (English: Saheeh International; Bangla: Taisirul Quran; Urdu: Maududi) ---------- */
function loadTrx(l){
  if (l === "en" || S.TRX[l]) return Promise.resolve(S.TRX[l]);
  if (S.trxState[l] && S.trxState[l].then) return S.trxState[l];
  const pr = fetch(`tr-${l}.json`).then(r => { if (!r.ok) throw 0; return r.json(); })
    .then(j => { S.TRX[l] = j; S.trxState[l] = "ok"; render(); return j; })
    .catch(() => { S.trxState[l] = "failed"; render(); return null; });
  S.trxState[l] = pr; return pr;
}
function baseTr(s, a, l){
  l = l || S.trLang;
  if (l === "en") return S.Q[s-1].v[a-1][1];
  const t = S.TRX[l];
  if (!t) { loadTrx(l); return S.trxState[l] === "failed" ? "(This translation didn't load. Reload the page.)" : "…"; }
  return t[s-1][a-1];
}
function trRev(s, a, l){ return (S.trAll[l || S.trLang] || {})[key(s,a)] || null; }
function trText(s, a, l){ const r = trRev(s, a, l); return r ? r.text : baseTr(s, a, l); }
const trDocId = (s, a, l) => l === "en" ? `${s}-${a}` : `${s}-${a}-${l}`;
const trAttrs = (l) => { l = l || S.trLang; return `lang="${l}" dir="${RTL[l]?"rtl":"ltr"}"`; };
function setTrDocs(list){
  const all = {en:{}, bn:{}, ur:{}};
  for (const v of list) { const l = v.lang || "en"; if (all[l] && validRefSafe(v.s, v.a)) all[l][key(v.s,v.a)] = v; }
  S.trAll = all; S.tr = all[S.trLang];
}
function parseRefs(str){
  // "2:255", "2:250-260", "2 255", "3:10-12, 4:1"
  const out = [];
  for (const part of String(str).split(/[,;،]+/)) {
    const p = part.trim(); if (!p) continue;
    const m = p.match(/^(\d{1,3})\s*[:.\s]\s*(\d{1,3})(?:\s*[-–]\s*(\d{1,3}))?$/);
    if (!m) return null;
    const s = +m[1], a = +m[2], b = m[3] ? +m[3] : a;
    if (!validRef(s,a) || !validRef(s,b) || b < a) return null;
    out.push({s, from:a, to:b});
  }
  return out.length ? out : null;
}
const rangeLabel = r => r.from === r.to ? `${r.s}:${r.from}` : `${r.s}:${r.from}–${r.to}`;
const normalize = s => String(s||"").toLowerCase().replace(/[ً-ٰٟۖ-ۭـ]/g,"").replace(/[إأآٱ]/g,"ا").replace(/ى/g,"ي");

function pick(obj, lang, src){
  obj = obj || {};
  if (obj[lang] && obj[lang].trim()) return {text: obj[lang], lang, fallback:false};
  const order = [src, "en", ...LANGS].filter(Boolean);
  for (const l of order) if (obj[l] && obj[l].trim()) return {text: obj[l], lang: l, fallback: true};
  return {text:"", lang, fallback:false};
}
// Titles fall back only to the language the piece was written in. If the author left the title empty there,
// no other language's title is used (a word analysis then shows the word itself).
function pickTitle(obj, lang, src){
  obj = obj || {};
  if (src && !(obj[src] || "").trim()) return {text:"", lang, fallback:false};
  return pick(obj, lang, src);
}
/* Article format:
   ## Section  ### Sub-section  #### Minor heading
   >> Qur'an / Arabic quotation block (Quranic script, right-to-left)
   > quotation       - bullet      1. numbered      --- divider
   **bold**  *italic*  [link text](https://…)  2:255 ayah link
   footnote marker [^1] with a line  [^1]: note text  anywhere in the article */
const ARABIC_RE = /[؀-ۿݐ-ݿﭐ-﷿ﹰ-﻿]/g;
const isArabicPara = t => { const letters = t.replace(/[\s\d\p{P}\p{S}]/gu,""); return letters.length > 0 && ((t.match(ARABIC_RE)||[]).length / letters.length) > 0.7; };
function renderDoc(src, lang, uid){
  uid = uid || "d";
  const fnDefs = {}, fnOrder = [];
  const bodyLines = [];
  for (const raw of String(src||"").split(/\r?\n/)) {
    const m = raw.match(/^\s*\[\^([^\]\s]+)\]:\s*(.*)$/);
    if (m) fnDefs[m[1]] = m[2]; else bodyLines.push(raw);
  }
  const toc = [];
  let words = 0;
  const inline = t => esc(t)
    .replace(/\[\^([^\]\s]+)\]/g, (m, id) => {
      let n = fnOrder.indexOf(id); if (n < 0) { fnOrder.push(id); n = fnOrder.length - 1; }
      return `<sup class="fnref"><button type="button" data-fn="${uid}-fn-${n+1}" id="${uid}-fr-${n+1}" aria-label="Note ${n+1}">${n+1}</button></sup>`;
    })
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (m, txt, url) => `<a href="${url}" target="_blank" rel="noopener noreferrer">${txt}</a>`)
    .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
    .replace(/(^|[\s(])\*(?!\s)(.+?)\*(?=[\s).,;:!?،]|$)/g,"$1<em>$2</em>")
    .replace(/(^|[^\w\/:])(\d{1,3}):(\d{1,3})(?![\w:])/g,(m,pre,s,a)=> validRef(+s,+a) ? `${pre}<button type="button" class="reflink" data-go="${s}:${a}">${s}:${a}</button>` : m);
  const auto = !(lang === "ar" || lang === "ur");
  let html = "", para = [], list = null, quote = [], arq = [];
  const flushP = () => {
    if (!para.length) return;
    const joined = para.join("\n");
    words += joined.split(/\s+/).filter(Boolean).length;
    if (auto && isArabicPara(joined)) html += `<p class="ar-quote" lang="ar" dir="rtl">${para.map(inline).join("<br>")}</p>`;
    else html += `<p>${para.map(inline).join("<br>")}</p>`;
    para = [];
  };
  const flushL = () => { if (list){ html += `<${list.t}>${list.items.map(i=>`<li>${inline(i)}</li>`).join("")}</${list.t}>`; list = null; } };
  const flushQ = () => { if (quote.length){ html += `<blockquote>${quote.map(inline).join("<br>")}</blockquote>`; quote = []; } };
  const flushA = () => { if (arq.length){ html += `<p class="ar-quote" lang="ar" dir="rtl">${arq.map(inline).join("<br>")}</p>`; arq = []; } };
  const flushAll = () => { flushP(); flushL(); flushQ(); flushA(); };
  for (const raw of bodyLines) {
    const l = raw.trimEnd();
    let m;
    if (!l.trim()) { flushAll(); continue; }
    if ((m = l.match(/^(#{1,4})\s+(.*)$/))) {
      flushAll();
      const lvl = m[1].length <= 2 ? 2 : m[1].length; // # and ## = section, ### = sub-section, #### = minor
      const id = `${uid}-h-${toc.length+1}`;
      if (lvl <= 3) toc.push({id, lvl, text: m[2].replace(/\*\*|\*|\[\^[^\]]+\]/g,"")});
      html += `<h${lvl+1} id="${id}" class="ah${lvl}">${inline(m[2])}</h${lvl+1}>`;
      words += m[2].split(/\s+/).length;
      continue;
    }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(l)) { flushAll(); html += `<hr>`; continue; }
    if ((m = l.match(/^>>\s?(.*)$/))) { flushP(); flushL(); flushQ(); arq.push(m[1]); continue; }
    if ((m = l.match(/^>\s?(.*)$/))) { flushP(); flushL(); flushA(); quote.push(m[1]); words += m[1].split(/\s+/).length; continue; }
    if ((m = l.match(/^\s*[-•*]\s+(.*)$/))) { flushP(); flushQ(); flushA(); if (!list || list.t!=="ul"){ flushL(); list={t:"ul",items:[]}; } list.items.push(m[1]); words += m[1].split(/\s+/).length; continue; }
    if ((m = l.match(/^\s*[\d٠-٩০-৯]+[.)]\s+(.*)$/))) { flushP(); flushQ(); flushA(); if (!list || list.t!=="ol"){ flushL(); list={t:"ol",items:[]}; } list.items.push(m[1]); words += m[1].split(/\s+/).length; continue; }
    flushL(); flushQ(); flushA(); para.push(l);
  }
  flushAll();
  if (fnOrder.length) {
    html += `<section class="footnotes"><h4>Notes</h4><ol>${fnOrder.map((id,i)=>`<li id="${uid}-fn-${i+1}">${inline(fnDefs[id] || "")} <button type="button" class="fnback" data-fn="${uid}-fr-${i+1}" aria-label="Back to text">↩</button></li>`).join("")}</ol></section>`;
  }
  return {html, toc, words, notes: fnOrder.length};
}
const mdLite = (src, lang) => renderDoc(src, lang).html;
const isLong = (src) => { const t = String(src||""); return t.length > 900 || /^#{1,4}\s/m.test(t) || /\[\^[^\]]+\]/.test(t); };
function toast(msg){
  const r = $("#toast-root");
  r.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toast.t); toast.t = setTimeout(()=> r.innerHTML = "", 3200);
}

/* ---------- derived indexes ---------- */
let IDX = {notes:{}, lessons:{}, words:{}, counts:{}};
function reindex(){
  const notes = {}, lessons = {}, words = {}, counts = {};
  const bump = (s, k) => { (counts[s] ||= {rev:0,exp:0,les:0,wa:0})[k]++; };
  for (const n of S.notes) { (notes[key(n.s,n.a)] ||= []).push(n); bump(n.s, "exp"); }
  for (const w of S.words) { (words[key(w.s,w.a)] ||= []).push(w); bump(w.s, "wa"); }
  for (const k in S.tr) bump(S.tr[k].s, "rev");
  for (const l of S.lessons) {
    const seen = new Set();
    for (const r of (l.ranges||[])) {
      for (let a=r.from; a<=r.to; a++) (lessons[key(r.s,a)] ||= []).push(l);
      if (!seen.has(r.s)) { bump(r.s,"les"); seen.add(r.s); }
    }
  }
  for (const k in notes) notes[k].sort((x,y)=> (x.createdAt||0)-(y.createdAt||0));
  for (const k in words) words[k].sort((x,y)=> (x.w||0)-(y.w||0));
  IDX = {notes, lessons, words, counts};
}

/* ---------- navigation ---------- */
function setHash(h){ try { if (S.static && location.hash !== "#" + h) history.pushState(null, "", "#" + h); else history.replaceState(null, "", "#" + h); } catch {} }
function go(view, opts={}){
  if (S.keepRet) S.keepRet = false; else S.ret = null;
  const prev = S.view, prevSurah = S.surah;
  S.view = view;
  if (view === "surah") {
    S.surah = opts.s || S.surah;
    S.flashKey = opts.a ? key(S.surah, opts.a) : null;
    setHash(opts.a ? `s${S.surah}-${opts.a}` : `s${S.surah}`);
  } else if (view === "article") {
    const from = prev === "article" ? S.art?.from : (prev === "surah" ? {surah: prevSurah, y: window.scrollY} : prev);
    S.art = {kind: opts.kind, id: opts.id, from};
    if (/^[A-Za-z0-9_.~-]+$/.test(opts.id)) setHash(`${opts.kind}-${opts.id}`);
  } else setHash(view);
  render();
  if (view === "surah" && opts.a) {
    requestAnimationFrame(() => {
      const el = document.getElementById(`a-${S.surah}-${opts.a}`);
      if (el) { el.scrollIntoView({block:"start"}); }
    });
  } else if (!opts.keepScroll) window.scrollTo(0,0);
}
function goRef(ref){
  const [s,a] = ref.split(":").map(Number);
  if (validRef(s,a)) {
    // Remember the exact place we left, so one click brings the reader back.
    const y = window.scrollY;
    if (S.view === "article" && S.art) {
      const it = itemOf(S.art.kind, S.art.id);
      const t = it ? (pickTitle(it.title, S.lang, it.src).text || (S.art.kind === "w" ? it.word : "") || "") : "";
      const kindL = S.art.kind === "l" ? "lesson" : S.art.kind === "w" ? "word analysis" : "note";
      S.ret = {view: "article", art: Object.assign({}, S.art), y, label: t ? `Back to “${t.length > 48 ? t.slice(0, 46) + "…" : t}”` : `Back to the ${kindL}`};
    } else if (S.view === "surah") {
      if (!S.ret || S.ret.view !== "surah" || S.ret.surah !== S.surah || Math.abs(S.ret.y - y) > 40) S.ret = {view: "surah", surah: S.surah, y, label: `Back to where you were in ${surahOf(S.surah).tl}`};
    } else if (S.view === "notes" || S.view === "lessons" || S.view === "words") {
      S.ret = {view: S.view, y, label: `Back to ${S.view === "words" ? "Word analysis" : S.view[0].toUpperCase() + S.view.slice(1)}`};
    }
    S.keepRet = true; if (S.onlyMarked && !hasMarks(s,a)) S.onlyMarked = false; S.open.add(key(s,a)); go("surah",{s,a}); }
}
function fromHash(){
  const h = (location.hash||"").slice(1);
  let m;
  if (h === "" || h === "surahs") S.view = "surahs";
  else if (h === "notes" || h === "lessons" || h === "words") S.view = h;
  else if ((m = h.match(/^([nlw])-([A-Za-z0-9_.~-]+)$/))) { S.view = "article"; S.art = {kind: m[1], id: m[2], from: m[1]==="n" ? "notes" : m[1]==="w" ? "words" : "lessons"}; }
  else if ((m = h.match(/^s(\d{1,3})(?:-(\d{1,3}))?$/)) && +m[1]>=1 && +m[1]<=114) { S.view = "surah"; S.surah = +m[1]; if (m[2]) { S.pendingAyah = +m[2]; S.open.add(key(+m[1],+m[2])); } }
}

function drawBackPill(){
  const r = $("#back-root"); if (!r) return;
  const R0 = S.ret;
  if (!R0 || S.view !== "surah" || (R0.view === "surah" && R0.surah === S.surah && Math.abs(window.scrollY - R0.y) < 40 && !S.flashKey)) { r.innerHTML = ""; return; }
  r.innerHTML = `<div class="backpill" role="navigation" aria-label="Return"><button type="button" data-goback title="${esc(R0.label)}">← ${esc(R0.label)}</button><button type="button" class="x" data-goback-x aria-label="Dismiss">✕</button></div>`;
}
function goBack(){
  const R0 = S.ret; if (!R0) return;
  S.ret = null; S.flashKey = null;
  if (R0.view === "article") { S.view = "article"; S.art = R0.art; setHash(`${R0.art.kind}-${R0.art.id}`); }
  else if (R0.view === "surah") { S.view = "surah"; S.surah = R0.surah; setHash(`s${R0.surah}`); }
  else { S.view = R0.view; setHash(R0.view); }
  render();
  requestAnimationFrame(() => requestAnimationFrame(() => window.scrollTo(0, R0.y)));
}

/* ---------- Qur'an font ---------- */
const QFONTS = {
  sch:   {label:"Scheherazade New (clear)", css:'"Scheherazade New","Noto Naskh Arabic","Traditional Arabic",serif'},
  naskh: {label:"Noto Naskh (plain)",       css:'"Noto Naskh Arabic","Scheherazade New","Traditional Arabic",serif'},
  amiri: {label:"Amiri Quran (calligraphic)", css:'"Amiri Quran","Scheherazade New","Traditional Arabic",serif'}
};
function applyQFont(){
  const root = document.documentElement, r = root.style;
  const ip = S.script === "indopak" && S.ipState === "ready";
  root.classList.toggle("script-indopak", ip);
  if (ip) r.removeProperty("--f-quran"); else r.setProperty("--f-quran", QFONTS[S.qfont].css);
  r.setProperty("--q-scale", String(S.qscale));
  if (S.script === "indopak" && S.ipState === "idle") loadIndoPak();
}
function arText(s, a){
  if (S.script === "indopak" && S.ipState === "ready" && S.IP) return S.IP[s-1][a-1];
  return S.Q[s-1].v[a-1][0];
}
function loadIndoPak(){
  S.ipState = "loading";
  const text = fetch("indopak.json").then(r => { if (!r.ok) throw 0; return r.json(); });
  const font = fetch("indopak-font.woff2").then(r => { if (!r.ok) throw 0; return r.arrayBuffer(); })
    .then(buf => { const ff = new FontFace("IndoPak Quran", buf); document.fonts.add(ff); return ff.load(); });
  Promise.all([text, font]).then(([t]) => { S.IP = t; S.ipState = "ready"; render(); })
    .catch(() => { S.ipState = "failed"; toast("The IndoPak script couldn't load. Showing the Madani script."); render(); });
}
function qfontControls(){
  return `<div class="qfont"><span class="flabel">Script</span>
    <div class="seg" role="group" aria-label="Qur'an script"><button type="button" data-script="indopak" aria-pressed="${S.script==="indopak"}">IndoPak</button><button type="button" data-script="madani" aria-pressed="${S.script==="madani"}">Madani</button></div>
    ${S.script==="indopak" && S.ipState==="loading" ? `<span class="small muted">Loading…</span>` : ""}
    ${S.script==="madani" ? `<label class="flabel" for="qfont">Font</label>
    <select id="qfont">${Object.entries(QFONTS).map(([k,f])=>`<option value="${k}" ${S.qfont===k?"selected":""}>${f.label}</option>`).join("")}</select>` : ""}
    <div class="seg" role="group" aria-label="Arabic text size"><button type="button" data-qsize="-1" aria-label="Smaller Arabic text">A−</button><button type="button" data-qsize="1" aria-label="Larger Arabic text">A+</button></div></div>`;
}


/* ---------- full screen reading ---------- */
function focusTitle(){
  if (S.view === "surah") { const su = surahOf(S.surah); return `${su.n}. ${su.tl}`; }
  if (S.view === "article") { const A = S.art || {}; const it = itemOf(A.kind, A.id); return it ? ((A.kind === "w" && !pickTitle(it.title, S.lang, it.src).text) ? it.word : pickTitle(it.title, S.lang, it.src).text || "Untitled") : ""; }
  return "";
}
function drawFocusBar(){
  const r = $("#focus-root");
  if (!S.focus) { r.innerHTML = ""; return; }
  r.innerHTML = `<div class="focusbar" role="toolbar" aria-label="Reading controls">
    <span class="fb-title">${esc(focusTitle())}</span>
    ${S.view === "surah" ? `${S.surah > 1 ? `<button type="button" class="btn ghost small" data-surah="${S.surah-1}" aria-label="Previous surah">‹</button>` : ""}${S.surah < 114 ? `<button type="button" class="btn ghost small" data-surah="${S.surah+1}" aria-label="Next surah">›</button>` : ""}` : ""}
    <span class="seg" role="group" aria-label="Text size"><button type="button" data-fsize="-1" aria-label="Smaller text">A−</button><button type="button" data-fsize="1" aria-label="Larger text">A+</button></span>
    <button type="button" class="btn small" data-unfocus>Exit full screen</button>

}
function applyReadScale(){ document.documentElement.style.setProperty("--read-scale", String(S.readScale)); }
async function enterFocus(){

  document.documentElement.classList.add("reading");

}
function exitFocus(){
  S.focus = false;

}
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && S.focus && S.fsNative) exitFocus(); });

/* ---------- rendering ---------- */
function render(){
  applyQFont();
  if (S.focus && S.view !== "surah" && S.view !== "article") { S.focus = false; document.documentElement.classList.remove("reading"); if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); }
  setTimeout(drawFocusBar, 0);
  drawBackPill();
  document.querySelectorAll("nav.tabs button").forEach(b => {
    const cur = b.dataset.nav === S.view || (b.dataset.nav==="surahs" && S.view==="surah")
      || (S.view==="article" && ((S.art?.kind==="l" && b.dataset.nav==="lessons") || (S.art?.kind==="n" && b.dataset.nav==="notes") || (S.art?.kind==="w" && b.dataset.nav==="words")));
    if (cur) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
  });
  document.querySelectorAll(".seg button[data-lang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === S.lang)));
  document.querySelectorAll(".seg button[data-trlang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.trlang === S.trLang)));
  const pill = $("#modepill");

  const app = $("#app");
  const y = window.scrollY;
  if (S.view === "surahs") app.innerHTML = viewSurahs();
  else if (S.view === "surah") { watchIrab(S.surah); app.innerHTML = viewSurah(); }
  else if (S.view === "notes") app.innerHTML = viewNotes();
  else if (S.view === "lessons") app.innerHTML = viewLessons();
  else if (S.view === "words") app.innerHTML = viewWords();
  else if (S.view === "article") app.innerHTML = viewArticle();
  window.scrollTo(0, y);
  if (S.pendingAyah) { const a = S.pendingAyah; S.pendingAyah = null; S.flashKey = key(S.surah,a); render(); requestAnimationFrame(()=> document.getElementById(`a-${S.surah}-${a}`)?.scrollIntoView({block:"start"})); }
}

function statusBar(){
  if (S.dbState === "ok") return "";
  if (S.dbState === "loading") return `<div class="statusbar">Loading saved translations, explanations and lessons…</div>`;
  return `<div class="statusbar">Saved write-ups can't be loaded in this view, so only the Qur'an text and the Saheeh International translation are shown. Open the page from claude.ai to see and edit the saved work.</div>`;

function marksFor(s, counts){

    c.les ? `<span class="chip les">${c.les} lesson${c.les>1?"s":""}</span>` : "",
    c.wa ? `<span class="chip wa">${c.wa} word${c.wa>1?"s":""}</span>` : ""
  ].join("");
}

function viewSurahs(){

}

function hasMarks(s,a){ const k = key(s,a); return !!(S.tr[k] || IDX.notes[k] || IDX.lessons[k]); }

function viewSurah(){

  const ayahs = su.v.map((v,i) => ({a:i+1, ar:arText(su.n,i+1), en:baseTr(su.n,i+1)})).filter(x => !S.onlyMarked || hasMarks(su.n, x.a));

  ${showBism && !S.onlyMarked ? `<div class="bism" lang="ar" dir="rtl">${esc(bism)}</div>` : ""}
  ${ayahs.map(x => ayahHTML(su.n, x)).join("") || `<div class="empty" style="margin-top:16px"><b>No marked ayahs in this surah</b>Turn off “Only ayahs with marks” to see every ayah.</div>`}`;
}

function ayahHTML(s, x){
  const k = key(s, x.a);
  const rev = S.tr[k];
  const notes = IDX.notes[k] || [];
  const lessons = IDX.lessons[k] || [];
  const wlist = IDX.words[k] || [];

  return `<article class="ayah${S.flashKey===k?" flash":""}" id="a-${s}-${x.a}">
    <div class="anum">${s}:${x.a}${dots.length?`<div class="dots" aria-hidden="true">${dots.map(d=>`<span class="dot ${d}"></span>`).join("")}</div>`:""}</div>
    <div class="abody">

      <p class="tr${rev?" revised":""}" ${trAttrs()}>${esc(rev ? rev.text : x.en)}</p>
      ${rev ? `<div class="revline"><span class="chip rev" title="This translation has been revised from ${TR_NAME[S.trLang]}">Translation revised</span>
        <button type="button" class="btn ghost small" data-compare="${k}">${S.compare.has(k)?"Hide original":"Compare with original"}</button></div>
        ${S.compare.has(k) ? `<div class="orig" ${trAttrs()}><b>${TR_NAME[S.trLang]}</b>${esc(x.en)}${rev.note?`<div style="margin-top:8px;color:var(--ink)"><b>Reason for revision</b>${esc(rev.note)}</div>`:""}</div>` : ""}` : ""}
      ${(notes.length || lessons.length || wlist.length) ? `<div class="marks">
        ${nExp ? `<button type="button" class="chip exp" data-toggle="${k}" aria-expanded="${open}">${nExp} note${nExp>1?"s":""}</button>` : ""}

        ${lessons.map(l => `<button type="button" class="chip les" data-lesson="${esc(l.id)}">Lesson: ${esc(pickTitle(l.title,S.lang,l.src).text || "Untitled")}</button>`).join("")}

      </div>
    </div>
  </article>`;
}

function langBlock(obj, src, cls){
  const p = pick(obj, S.lang, src);
  return {p, attrs:`lang="${p.lang}" dir="${RTL[p.lang]?"rtl":"ltr"}"`};
}
function fallbackNote(p, ai){
  let s = "";
  if (p.fallback) s += `<div class="notice">Not yet available in ${LNAME_EN[S.lang]}. Showing ${LNAME_EN[p.lang]}.</div> `;
  else if (ai && ai[p.lang]) s += `<div class="notice">AI-assisted translation, not yet reviewed.</div> `;
  return s;
}
const readMins = w => Math.max(1, Math.round(w / 200));
function noteCard(n, withRef){
  const t = langBlock(n.title, n.src), b = langBlock(n.body, n.src);
  const isQ = n.kind === "question";
  const long = isLong(b.p.text);
  const sn = snippet(n, 320);

function viewArticle(){

      ${isW && t.text === it.word ? "" : `<h1 class="art-title w" lang="${t.lang}" dir="${RTL[t.lang]?"rtl":"ltr"}">${esc(t.text || "Untitled")}</h1>`}

        : ayahs.map(([s,a])=>ayahBlock(s,a)).join("")}
    </section>
    <div class="art-grid">
      ${toc}

}


/* ---------- word analysis ---------- */
function itemOf(kind, id){ return (kind === "l" ? S.lessons : kind === "w" ? S.words : S.notes).find(x => x.id === id); }
function wordCardList(w){

function viewWords(){
  const q = S.wq.trim();
  const refs = q ? refMatch(q) : null;
  const nq = normalize(q.replace(/^#/, ""));
  const items = S.words.filter(w => (!S.wroot || w.root === S.wroot)
      && (refs ? inRanges(w.s, w.a, refs) : (!q || normalize([w.word, w.root, spaced(w.root||""), w.lemma].join(" ")).includes(nq) || textHit(w, q))))
    .sort((a, b) => (a.s*1000+a.a) - (b.s*1000+b.a) || (a.w||0) - (b.w||0));
  const roots = [...new Map(S.words.filter(w => w.root).map(w => [w.root, 0])).keys()].sort((a, b) => a.localeCompare(b, "ar"));
  const count = r => S.words.filter(w => w.root === r).length;

  <div class="filters">
    <div class="row">
      <input type="search" id="wq" class="search" placeholder="Search a word, a root like رحم, or 2:255" value="${esc(S.wq)}" aria-label="Search word analyses">

        <select id="wroot" style="width:auto;min-width:160px"><option value="">All roots (${S.words.length})</option>

/* ---------- search ---------- */
function refMatch(q){
  const refs = parseRefs(q);
  if (refs) return refs;
  const m = q.trim().match(/^(\d{1,3})$/);
  if (m && +m[1]>=1 && +m[1]<=114) return [{s:+m[1], from:1, to:surahOf(+m[1]).v.length}];
  return null;
}
const inRanges = (s,a,ranges) => ranges.some(r => r.s===s && a>=r.from && a<=r.to);
const overlaps = (lr, ranges) => (lr||[]).some(x => ranges.some(r => r.s===x.s && x.from<=r.to && x.to>=r.from));
function textHit(item, q){
  if (!q) return true;
  const hay = normalize([catName(item.cat), ...LANGS.map(l=>(item.title||{})[l]), ...LANGS.map(l=>(item.summary||{})[l]), ...LANGS.map(l=>(item.body||{})[l]), ...(item.tags||[])].join(" \n "));
  return normalize(q).split(/\s+/).filter(Boolean).every(w => hay.includes(w.replace(/^#/,"")));
}
function snippet(item, max){
  max = max || 220;
  const s = pick(item.summary, S.lang, item.src);
  if (s.text.trim() && !(s.fallback && pick(item.body, S.lang, item.src).lang === S.lang)) return {text: s.text.trim(), lang: s.lang};
  const p = pick(item.body, S.lang, item.src);
  const t = p.text.split(/\r?\n/).filter(l => !/^\s*\[\^[^\]]+\]:/.test(l) && !/^#{1,4}\s/.test(l)).join(" ")
    .replace(/\[\^[^\]]+\]/g,"").replace(/\[([^\]]+)\]\([^)]+\)/g,"$1").replace(/[#*>]/g,"").replace(/\s+/g," ").trim();
  return {text: t.length>max ? t.slice(0,max)+"…" : t, lang:p.lang};
}
function tagCounts(items){
  const m = new Map();
  for (const it of items) for (const t of (it.tags||[])) m.set(t, (m.get(t)||0)+1);
  return [...m.entries()].sort((a,b)=> b[1]-a[1] || a[0].localeCompare(b[0]));
}

function viewNotes(){
  const q = S.nq.trim();
  const refs = q ? refMatch(q) : null;
  let items = [];
  if (S.nkind !== "revised") {
    items = S.notes.filter(n => true
      && (!S.ncat || (S.ncat === "none" ? !catById(n.cat) : n.cat === S.ncat))
      && (!S.ntag || (n.tags||[]).includes(S.ntag))
      && (refs ? inRanges(n.s,n.a,refs) : textHit(n,q)));
    items.sort((a,b)=> (a.s*1000+a.a)-(b.s*1000+b.a) || (a.createdAt||0)-(b.createdAt||0));
  }
  let revs = [];
  if (S.nkind !== "notes") {
    revs = Object.values(S.tr).filter(r => !S.ntag && !S.ncat && (refs ? inRanges(r.s,r.a,refs) : (!q || normalize(r.text+" "+(r.note||"")).includes(normalize(q)))));
    revs.sort((a,b)=> (a.s*1000+a.a)-(b.s*1000+b.a));
  }
  const tags = tagCounts(S.notes);
  const kinds = [["all","Notes and revised translations"],["notes","Notes only"],["revised","Revised translations"]];
  const results = [
    ...items.map(n => {
      const t = pickTitle(n.title, S.lang, n.src), sn = snippet(n), isQ = n.kind==="question";
      const long = isLong(pick(n.body, S.lang, n.src).text);
      if (!long && S.openNote.has(n.id)) return noteCard(n, true).replace('<div class="whead">', `<div class="whead"><button type="button" class="btn ghost small" data-open-note="${esc(n.id)}">Collapse</button>`);
      return `<div class="wcard">
        <div class="whead"><span class="chip exp">Note</span>${catChip(n.cat)}
        <button type="button" class="reflink" data-go="${n.s}:${n.a}">${n.s}:${n.a} · ${esc(surahOf(n.s).tl)}</button><span class="spacer"></span>
        ${S.admin ? `<button type="button" class="btn ghost small" data-edit-note="${esc(n.id)}">Edit</button>` : ""}</div>

        ${sn.text ? `<div class="snip w" lang="${sn.lang}" dir="${RTL[sn.lang]?"rtl":"ltr"}">${esc(sn.text)}</div>` : ""}
        <div class="row" style="margin-top:8px">${long ? `<button type="button" class="btn small" data-article="n:${esc(n.id)}">Read article</button>` : `<button type="button" class="btn small" data-open-note="${esc(n.id)}">Read</button><button type="button" class="btn small" data-article="n:${esc(n.id)}">Open as page</button>`}<button type="button" class="btn small" data-share="n:${esc(n.id)}">Share</button>
        ${(n.tags||[]).map(tg=>`<button type="button" class="tag" data-ntag="${esc(tg)}" aria-pressed="${S.ntag===tg}">#${esc(tg)}</button>`).join("")}</div>
      </div>`;
    }),
    ...revs.map(r => `<div class="wcard">
      <div class="whead"><span class="chip rev">Translation revised</span>
      <button type="button" class="reflink" data-go="${r.s}:${r.a}">${r.s}:${r.a} · ${esc(surahOf(r.s).tl)}</button><span class="spacer"></span>
      ${S.admin ? `<button type="button" class="btn ghost small" data-edit-tr="${r.s}:${r.a}">Edit</button>` : ""}</div>
      <p class="tr" style="font-size:15.5px" ${trAttrs()}>${esc(r.text)}</p>
      <div class="orig" ${trAttrs()}><b>${TR_NAME[S.trLang]}</b>${esc(baseTr(r.s, r.a))}${r.note?`<div style="margin-top:8px;color:var(--ink)"><b>Reason for revision</b>${esc(r.note)}</div>`:""}</div>
    </div>`)
  ];
  const any = S.notes.length || Object.keys(S.tr).length;
  return `${statusBar()}
  <div class="phead"><h1>Notes</h1>
    ${S.admin ? `<button type="button" class="btn" data-cats>Manage categories</button><button type="button" class="btn primary" data-new-note="explanation" data-ref="">New note</button>` : ""}</div>
  <p class="lede">Every note written under an ayah, plus every revised translation. Search by words in any of the four languages, by tag, or by ayah number such as <b>2:255</b>, a range such as <b>2:250-260</b>, or a surah number such as <b>18</b>.</p>
  <div class="filters">
    <div class="row">
      <input type="search" id="nq" class="search" placeholder="Search words, #tag, or 2:255" value="${esc(S.nq)}" aria-label="Search notes">
      <div class="seg" role="group" aria-label="Type">${kinds.map(([k,l])=>`<button type="button" data-nkind="${k}" aria-pressed="${S.nkind===k}">${l}</button>`).join("")}</div>
    </div>
    <div class="catfilter"><label class="flabel" for="ncat">Category</label>
      <select id="ncat" style="width:auto;min-width:220px">
        <option value="" ${!S.ncat?"selected":""}>All categories (${S.notes.length})</option>
        ${S.cats.map(c => `<option value="${esc(c.id)}" ${S.ncat===c.id?"selected":""}>${esc(catName(c.id))} (${catUse(c.id)})</option>`).join("")}
        ${S.notes.some(n => !catById(n.cat)) ? `<option value="none" ${S.ncat==="none"?"selected":""}>Uncategorised (${S.notes.filter(n => !catById(n.cat)).length})</option>` : ""}
      </select></div>
    ${tags.length ? `<div class="tagrow">${tags.map(([t,c])=>`<button type="button" class="tag" data-ntag="${esc(t)}" aria-pressed="${S.ntag===t}">#${esc(t)} <span class="muted">${c}</span></button>`).join("")}</div>` : ""}
    ${(q||S.ntag||S.ncat) ? `<div class="small muted">${results.length} result${results.length===1?"":"s"}${S.ncat?` in ${S.ncat==="none" ? "Uncategorised" : "“" + esc(catName(S.ncat)) + "”"}`:""}${refs?` for ayah ${refs.map(rangeLabel).join(", ")}`:""}${S.ntag?` tagged #${esc(S.ntag)}`:""} · <button type="button" class="btn ghost small" data-clear="notes">Clear</button></div>` : ""}

function viewLessons(){

function lessonCard(l){
  const t = langBlock(l.title, l.src);
  const sn = snippet(l, 320);
  const doc = renderDoc(pick(l.body, S.lang, l.src).text);
  const n = (l.ranges||[]).reduce((c,r)=>c + r.to - r.from + 1, 0);
  return `<div class="wcard" id="lesson-${esc(l.id)}">
    <div class="whead"><span class="chip les">Lesson</span>
      ${(l.ranges||[]).map(r=>`<button type="button" class="reflink" data-go="${r.s}:${r.from}">${rangeLabel(r)}</button>`).join(" ")}
      <span class="spacer"></span>
      ${S.admin ? `<button type="button" class="btn ghost small" data-edit-lesson="${esc(l.id)}">Edit</button>` : ""}
      <h3 class="${t.p.lang==="ar"||t.p.lang==="ur"?"w":""}" ${t.attrs}>${esc(t.p.text || "Untitled")}</h3>
    </div>
    ${sn.text ? `<div class="snip w" lang="${sn.lang}" dir="${RTL[sn.lang]?"rtl":"ltr"}">${esc(sn.text)}</div>` : ""}

      const txt = sent.t.filter(t => t[1] && t[7] === here).slice(0, 6).map(t => t[2]).join("").replace(/\s+/g, " ");
      clauses.push(`الجملة المبدوءة بـ«${bare(M.words[+first[1].split(":")[2]-1]?.[2].map(x=>x[0]).join("") || first[2])}» ابتدائية أو استئنافية لا محل لها من الإعراب.`);
    } else if (first) clauses.push(`هذه الآية تتمّة لجملة بدأت في الآية ${first[7]}.`);
    for (const t of sent.t) {
      if (!t[5] || t[5][0] === "PP" || !t[3] || t[7] !== here) continue;
      const kind = (CONS[t[5][0]] || [t[5][0]])[0];
      const h = byId[t[4]], r = t[3], c = relCase(r);
      const tx = `«${bare(t[5][1])}»`;
      if (r === "صلة") clauses.push(`${kind} ${tx} صلة الموصول لا محل لها من الإعراب.`);
      else if (r === "معطوف") clauses.push(`${kind} ${tx} معطوفة على «${hText(h)}»${where(h)} ولها حكمها.`);
      else if (r === "جواب الشرط") clauses.push(`${kind} ${tx} جواب الشرط.`);
      else if (r === "شرط") clauses.push(`${kind} ${tx} جملة الشرط.`);
      else if (FOLLOWERS.includes(r)) clauses.push(`${kind} ${tx} في محل ${caseOf(h) || "…"} ${r === "صفة" ? "نعت" : r} لـ«${hText(h)}»${where(h)}.`);
      else clauses.push(`${kind} ${tx} ${c ? `في محل ${c} ` : ""}${r}${h && h[1] ? ` لـ«${hText(h)}»${where(h)}` : ""}.`);
    }
    for (const t of sent.t) {
      if (!t[3] || t[3] === "root" || !t[1]) continue;
      const h = byId[t[4]];
      if (!h || h === t || !h[1]) continue;
      if (t[7] === here && h[7] !== here) links.push(`«${cleanW(t[2])}» في هذه الآية ${roleOf(t)} ← «${cleanW(h[2])}» في الآية ${h[7]}.`);
      if (h[7] === here && t[7] !== here) links.push(`«${cleanW(t[2])}» في الآية ${t[7]} ${roleOf(t)} ← «${cleanW(h[2])}» في هذه الآية.`);
    }
  }
  let out = lines.join("\n");
  if (clauses.length) out += `\n\n## محل الجمل من الإعراب\n` + clauses.map(c => "- " + c).join("\n");
  if (links.length) out += `\n\n## الارتباط بالآيات المجاورة\n` + [...new Set(links)].map(c => "- " + c).join("\n");
  return out;
}

/* ---------- word usage across the Qur'an (concordance by lemma or root, from the Quranic Arabic Corpus data) ---------- */
let CONC = null; const GD = {};

  try {
    const C = await loadConc();
    const lemmas = U.scope === "root" && it.root ? (C.R[it.root] || [it.lemma]) : [it.lemma];
    const codes = [].concat(...lemmas.map(l => C.L[l] || [])).sort((x, y) => x - y);

    await Promise.all(surahs.map(sn => loadGrammar(sn).then(d => { GD[sn] = d; U.loaded++; if (M && M.use === U && U.loaded % 10 === 0) redrawUsage(); })));

      const [s0, a0, w0] = decCode(c), wd = GD[s0][a0-1][w0-1];

      return {s: s0, a: a0, w: w0, surf, form: stripHarakat(surf), gloss: wd[1], mk: surahOf(s0).t === "meccan"};
    });
    const f = {}; U.rows.forEach(r => f[r.form] = (f[r.form] || 0) + 1);
    U.forms = Object.entries(f).sort((x, y) => y[1] - x[1]);
    U.state = "ok";
  } catch { if (M && M.use === U) U.state = "failed"; }

function redrawUsage(){ if (M && M.type === "word") { captureFields(); drawWriteEditor(); } }
function markWord(s, a, w){
  const toks = arText(s, a).split(/\s+/), wc = (GD[s] && GD[s][a-1]) ? GD[s][a-1].length : 0;
  const isWordTok = t => t && !/^[\u06D6-\u06ED\u06DE\u06E9]+$/.test(t);
  let n = 0; const out = toks.map(t => { if (!isWordTok(t)) return esc(t); n++; return n === w ? `<mark>${esc(t)}</mark>` : esc(t); });
  if (n === wc) return out.join(" ");
  // The script's word division differs from the corpus here: find the word by its letters instead.
  const sk = t => t.replace(/[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED\u0640\u08D3-\u08FFاٱأإآءىئؤۦيیوۥ]/g, "").replace(/ک/g, "ك").replace(/[ۃة]/g, "ه").replace(/[^\u0621-\u064A\u0671-\u06D3]/g, "");

}

/* ---------- long write-ups: stored in pieces ----------
   A database document is limited to about 256 KB. A write-up keeps the first piece of each language's text in its own document
   (body.<lang>) and any further pieces in the "chunks" collection: doc id `${kind}~${id}~${lang}~${r}~${i}` with
   {kind, ref, lang, r, i, text}; the write-up says how many it has in `more.<lang> = {r, n}` (r = a revision token, so a save
   swaps to a new set of pieces in one step). The app joins the pieces when it loads; everything else sees the whole text. */
const CHUNK_BYTES = 48000;
const cpBytes = c => c < 0x80 ? 1 : c < 0x800 ? 2 : c < 0x10000 ? 3 : 4;
const blen = s => { let n = 0; for (const ch of s) n += cpBytes(ch.codePointAt(0)); return n; };
function splitPieces(t){
  t = t || "";
  if (blen(t) <= CHUNK_BYTES) return [t];
  const out = []; let cur = "", curB = 0;
  for (const u of t.split(/(?=\n\n)/)) {            // paragraph units keep their leading blank line, so out.join("") === t
    const ub = blen(u);
    if (curB + ub <= CHUNK_BYTES) { cur += u; curB += ub; continue; }
    if (cur) { out.push(cur); cur = ""; curB = 0; }
    if (ub <= CHUNK_BYTES) { cur = u; curB = ub; continue; }
    for (const ch of u) { const b = cpBytes(ch.codePointAt(0)); if (curB + b > CHUNK_BYTES) { out.push(cur); cur = ""; curB = 0; } cur += ch; curB += b; }   // one huge paragraph
  }
  if (cur) out.push(cur);
  return out;
}
function stitchOne(raw, kind){
  const more = raw.more;
  if (!more) return raw;
  const body = Object.assign({}, raw.body); let partial = false;
  for (const l of Object.keys(more)) {
    const m = more[l]; if (!m || !m.n) continue;
    let txt = body[l] || "";
    for (let i = 1; i <= m.n; i++) { const p = S.chunkIx[`${kind}~${raw.id}~${l}~${m.r}~${i}`]; if (p == null) partial = true; else txt += p; }
    body[l] = txt;
  }
  return Object.assign({}, raw, {body}, partial ? {_partial: true} : {});
}
function restitch(){
  S.notes = S.rawNotes.map(n => stitchOne(n, "n"));
  S.lessons = S.rawLessons.map(n => stitchOne(n, "l"));
  S.words = S.rawWords.map(n => stitchOne(n, "w"));
}
async function dropStaleChunks(kind, ref, keep){
  const k = new Set(keep);
  for (const c of S.chunkDocs.slice()) if (c.kind === kind && c.ref === ref && !k.has(c.docId)) { try { await S.db.collection("chunks").doc(c.docId).delete(); } catch {} }
}
function dbErr(e){
  if (e?.code === "invalid_argument") return "You don't have permission to save here, or the write-up is too large (256 KB limit).";
  if (e?.code === "quota_exceeded") return "The storage limit is full. Delete old write-ups before adding new ones.";
  return "Saving failed. Check your connection and try again.";
}

  try { await S.downloads.save({filename: `ayah-by-ayah-backup-${new Date().toISOString().slice(0,10)}.json`, data}); }
  catch (e) { if (e?.code !== "declined") toast("The backup couldn't be saved here."); }
}

/* ---------- boot ---------- */
fromHash();
render();
loadTrx(S.trLang);
fetch("quran.json").then(r => { if (!r.ok) throw 0; return r.json(); }).then(q => { S.Q = q; render(); })
  .catch(() => { $("#app").innerHTML = `<div class="empty"><b>The Qur'an text didn't load</b>Reload the page to try again.</div>`; });

(async () => {
  const C = window.claude;
  if (!C || !C.use) return loadStatic();
  const [db, user, sample, downloads] = await Promise.all(["db","user","sample","downloads"].map(n => C.use(n).catch(()=>null)));
  if (user) { try { S.admin = !!(await user.canEdit()) || !!(await user.isOwner()); } catch {} }
  if (S.admin) { S.sample = sample; S.downloads = downloads; }
  if (!db) { S.dbState = "none"; S.admin = false; render(); return; }
  S.db = db;
  let got = 0;
  const ready = () => { if (++got >= 3) { S.dbState = "ok"; } };
  const fail = () => { S.dbState = "none"; render(); };
  let first = {tr:true, notes:true, lessons:true};
  db.collection("translations").onSnapshot(snap => {
    setTrDocs(snap.docs.map(d => d.data()).filter(Boolean)); if (first.tr) { first.tr=false; ready(); } reindex(); render();
  }, fail);
  db.collection("notes").onSnapshot(snap => {
    S.rawNotes = snap.docs.map(d => Object.assign({id:d.id}, d.data())).filter(n => validRefSafe(n.s, n.a)); S.notes = S.rawNotes.map(n => stitchOne(n, "n"));
    if (first.notes) { first.notes=false; ready(); } reindex(); render();
  }, fail);
  db.doc("settings/categories").onSnapshot(snap => {
    const d = snap.exists ? snap.data() : null;
    S.cats = (d?.list || []).slice().sort((a, b) => (a.order||0) - (b.order||0));
    render();
  }, () => {});
  db.collection("words").onSnapshot(snap => {
    S.rawWords = snap.docs.map(d => Object.assign({id:d.id}, d.data())).filter(w => validRefSafe(w.s, w.a)); S.words = S.rawWords.map(n => stitchOne(n, "w"));
    reindex(); render();
  }, () => {});
  db.collection("lessons").onSnapshot(snap => {
    S.rawLessons = snap.docs.map(d => Object.assign({id:d.id}, d.data())); S.lessons = S.rawLessons.map(n => stitchOne(n, "l"));
    if (first.lessons) { first.lessons=false; ready(); } reindex(); render();
  }, fail);
  db.collection("chunks").onSnapshot(snap => {
    S.chunkDocs = []; S.chunkIx = {};
    for (const d of snap.docs) { const c = d.data(); if (!c) continue; S.chunkDocs.push({docId: d.id, kind: c.kind, ref: c.ref}); S.chunkIx[`${c.kind}~${c.ref}~${c.lang}~${c.r}~${c.i}`] = c.text; }
    restitch(); reindex(); render();
  }, () => {});
  if (S.admin && S.downloads) {
    const f = document.createElement("button");
    f.type = "button"; f.className = "btn ghost small"; f.dataset.export = ""; f.textContent = "Back up all write-ups";
    $(".langbar").appendChild(f);
  }
  render();
})();
async function loadStatic(){
  // Public edition: read the published copy of the write-ups instead of the live database.
  try {
    const r = await fetch("data/content.json", {cache: "no-cache"});
    if (!r.ok) throw 0;
    const d = await r.json();
    S.static = true;
    setTrDocs(d.translations || []);
    S.notes = (d.notes || []).filter(n => validRefSafe(n.s, n.a));
    S.lessons = d.lessons || [];
    S.words = (d.words || []).filter(w => validRefSafe(w.s, w.a));
    S.cats = (d.categories || []).slice().sort((a, b) => (a.order||0) - (b.order||0));
    S.irabAll = d.irab || {};
    S.dbState = "ok";
    reindex(); render();
    const nav = () => { const y = window.scrollY; fromHash(); render(); if (S.view !== "surah") window.scrollTo(0, 0); };
    window.addEventListener("popstate", nav);
  } catch { S.dbState = "none"; render(); }
}
function validRefSafe(s,a){ return !S.Q || validRef(s,a); }
})();
</script>
